server:
  port: 8080

spring:
  application:
    name: driver-management-system
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:postgresql://localhost:5432/db_driver_management
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway removes legacy tables; Hibernate update creates/adjusts the retained MVP tables.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

logging:
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'
  level:
    com.safedriving: DEBUG
    org.hibernate.SQL: DEBUG

# Cấu hình JWT (đổi secret khi deploy thật, không commit secret thật lên git)
app:
  jwt:
    secret: 'CHANGE_THIS_SECRET_KEY_TO_SOMETHING_LONG_AND_RANDOM_BEFORE_PRODUCTION_0123456789'
    expiration-ms: 3600000 # 1 giờ (JWT token ngắn hạn, stateless không lưu DB)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Cấu hình kết nối FastAPI Nhận diện khuôn mặt
face-recognition:
  base-url: http://localhost:8000
