spring:
  application:
    name: driver-management-system-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: "TEST_SECRET_KEY_TEST_SECRET_KEY_TEST_SECRET_KEY_TEST_SECRET_KEY_1234567890"
    expiration-ms: 86400000
